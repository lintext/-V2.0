<!DOCTYPE html>
<html>

<head>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>小艾同学 - Live2D桌宠</title>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div id="subtitle-container">
        <p id="subtitle-text"></p>
    </div>

    <!-- 宠物「想象云朵」对白（AI 回复只在此展示，避免与底部字幕/聊天重复） -->
    <div id="pet-thought-cloud" class="pet-thought-cloud" aria-live="polite" style="display: none;">
        <div class="pet-thought-cloud-inner">
            <p class="pet-thought-cloud-text"></p>
        </div>
    </div>

    <!-- 治愈系二次元聊天悬浮窗口 -->
    <div id="text-chat-container">
        <!-- 顶部角色状态栏 -->
        <div id="chat-header">
            <div class="chat-avatar">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23c8b4dc'/%3E%3Ccircle cx='35' cy='40' r='8' fill='white'/%3E%3Ccircle cx='65' cy='40' r='8' fill='white'/%3E%3Cpath d='M30 60 Q50 80 70 60' stroke='white' stroke-width='4' fill='none'/%3E%3C/svg%3E" alt="小艾">
            </div>
            <div class="chat-title-info">
                <div class="chat-name">小艾同学</div>
                <div class="chat-status">
                    <span class="status-dot"></span>
                    <span class="status-text">在线</span>
                </div>
            </div>
            <div class="chat-header-actions">
                <div class="chat-action-btn chat-history-btn" title="历史记录">📜</div>
                <div class="chat-action-btn chat-clear-btn" title="清空对话">🗑</div>
                <div class="chat-action-btn chat-minimize-btn" title="最小化">
                    <span class="minimize-btn-icon">−</span>
                </div>
                <div class="chat-action-btn chat-close-btn" title="关闭">×</div>
            </div>
        </div>

        <!-- 中部聊天消息区 -->
        <div id="chat-messages-wrapper">
            <div id="chat-messages"></div>
        </div>

        <!-- 历史记录面板 -->
        <div id="chat-history-panel">
            <div class="history-header">
                <span>历史对话</span>
                <button id="history-new-session-btn" class="history-new-session-btn" title="开始新会话">新建会话</button>
                <div class="history-close-btn">×</div>
            </div>
            <div class="history-layout">
                <div id="chat-session-list"></div>
                <div id="chat-history-list"></div>
            </div>
        </div>

        <!-- AI 思考中提示 -->
        <div id="chat-thinking">
            <span>正在输入</span>
            <div class="thinking-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- 底部输入区 -->
        <div id="chat-input-container">
            <div class="chat-input-wrapper">
                <div id="chat-input" contenteditable="true" placeholder="输入消息..."></div>
                <div class="chat-input-actions">
                    <div class="input-action-btn" id="emoji-btn" title="表情">😊</div>
                    <div class="input-action-btn" id="voice-btn" title="语音">🎤</div>
                    <div class="input-action-btn" id="pet-interact-btn" title="互动">✨</div>
                </div>
            </div>
            <div id="chat-send-btn">发送</div>
        </div>

        <!-- 右侧迷你 Live2D 角色立绘 -->
        <div id="mini-live2d-container">
            <canvas id="mini-live2d-canvas"></canvas>
        </div>
    </div>

    <!-- 歌词气泡容器 -->
    <div id="lyrics-bubble-container">
        <div id="lyrics-bubble-text"></div>
    </div>

    <!-- 气泡框容器 -->
    <div id="bubble-container">
        <div id="bubble-text"></div>
    </div>

    <!-- 工具调用气泡框堆叠容器 -->
    <div id="tool-bubbles-container"></div>

    <!-- 引入 Live2D 依赖 -->
    <script src="libs/live2d.min.js"></script>
    <script src="libs/live2dcubismcore.min.js"></script>
    <script src="libs/pixi.min.js"></script>
    <script src="libs/pixi-live2d-display.min.js"></script>
    <script src="libs/pixi-live2d-display-extra.min.js"></script>
    <script src="app.js"></script>


</body>

</html>
